name: ci

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test1:
    name: Test 1
    runs-on: ubuntu-latest
    steps:
    - run: false
  test2:
    name: Test 2
    runs-on: ubuntu-latest
    steps:
    - run: false
  fail-check:
    name: Fail Check
    needs: [ test1, test2 ]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo failure
